<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ویڈیو ڈاؤن لوڈر</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f7f2;--ink:#13242b;--muted:#5d6e73;--line:#d5dbd4;--accent:#0e7c7b;--accent-ink:#fff;--warn:#b3261e;--card:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#10191c;--ink:#eaf1ee;--muted:#9bb0b0;--line:#27393d;--accent:#3cc4c0;--accent-ink:#06201f;--warn:#ff8a80;--card:#162226}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Nastaliq Urdu",serif;line-height:2.1}
  main{max-width:640px;margin:0 auto;padding:48px 20px}
  h1{font-size:2rem;margin:0 0 4px;line-height:1.8}
  p.lead{color:var(--muted);margin:0 0 28px}
  .row{display:flex;gap:10px}
  input[type=url]{flex:1;min-width:0;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;direction:ltr;text-align:left}
  input[type=url]:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button{font:inherit;padding:8px 22px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-weight:700}
  button.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
  button:disabled{opacity:.5;cursor:not-allowed}
  label.consent{display:flex;gap:10px;align-items:flex-start;margin:18px 0;color:var(--muted);font-size:.9rem}
  label.consent input{margin-top:14px;width:18px;height:18px;accent-color:var(--accent)}
  #msg{min-height:2em;color:var(--warn)}
  #result{display:none;margin-top:12px;border:2px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
  #result img{width:100%;display:block;max-height:300px;object-fit:cover}
  #result .body{padding:14px 18px}
  #result h2{font-size:1.05rem;margin:0}
  #result .meta{color:var(--muted);font-size:.85rem}
  #result .actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  footer{margin-top:48px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:14px}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>ویڈیو ڈاؤن لوڈر</h1>
  <p class="lead">یوٹیوب، ٹک ٹاک یا فیس بک ویڈیو کا لنک یہاں پیسٹ کریں۔</p>

  <div class="row">
    <input id="url" type="url" placeholder="https://..." aria-label="ویڈیو کا لنک">
    <button id="check">ویڈیو تلاش کریں</button>
  </div>

  <label class="consent">
    <input id="ok" type="checkbox">
    <span>میں تصدیق کرتا ہوں کہ یہ ویڈیو میری اپنی ہے یا مجھے اسے ڈاؤن لوڈ کرنے کی اجازت حاصل ہے، اور میں <a href="/terms">شرائط</a> سے متفق ہوں۔</span>
  </label>

  <div id="msg" role="alert"></div>

  <section id="result">
    <img id="thumb" alt="">
    <div class="body">
      <h2 id="title"></h2>
      <div class="meta" id="meta"></div>
      <div class="actions">
        <button id="dlVideo">ویڈیو ڈاؤن لوڈ کریں</button>
        <button id="dlAudio" class="alt">صرف آڈیو</button>
      </div>
    </div>
  </section>

  <footer>
    یہ سروس صرف ان ویڈیوز کے لیے ہے جنہیں ڈاؤن لوڈ کرنے کا آپ کو حق ہے۔ کاپی رائٹ کی شکایت: <a href="/terms">یہاں دیکھیں</a>۔
  </footer>
</main>

<script>
const $ = id => document.getElementById(id);
let current = "";

function fmt(s){ if(!s) return ""; const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }

$("check").onclick = async () => {
  $("msg").textContent = ""; $("result").style.display = "none";
  const url = $("url").value.trim();
  if(!url){ $("msg").textContent = "پہلے لنک پیسٹ کریں۔"; return; }
  $("check").disabled = true; $("check").textContent = "تلاش جاری ہے...";
  try{
    const r = await fetch("/api/info",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
    const d = await r.json();
    if(!r.ok){ $("msg").textContent = d.error; return; }
    current = url;
    $("thumb").src = d.thumbnail || ""; $("thumb").style.display = d.thumbnail ? "block" : "none";
    $("title").textContent = d.title || "";
    $("meta").textContent = [d.uploader, fmt(d.duration)].filter(Boolean).join(" — ");
    $("result").style.display = "block";
  }catch(e){ $("msg").textContent = "سرور سے رابطہ نہیں ہو سکا۔"; }
  finally{ $("check").disabled = false; $("check").textContent = "ویڈیو تلاش کریں"; }
};

function go(kind){
  if(!$("ok").checked){ $("msg").textContent = "ڈاؤن لوڈ سے پہلے تصدیق کا باکس ٹک کریں۔"; return; }
  $("msg").textContent = "";
  window.location = "/api/download?kind="+kind+"&url="+encodeURIComponent(current);
}
$("dlVideo").onclick = () => go("video");
$("dlAudio").onclick = () => go("audio");
</script>
</body>
</html>
